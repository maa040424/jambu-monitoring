services:

  # ─── Nginx ─────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: jambu_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: unless-stopped

  # ─── Laravel App (PHP-FPM) ─────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jambu_app
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started
    restart: unless-stopped

  # ─── Queue Worker (ARIMA & notifikasi) ─────
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jambu_queue
    command: php artisan queue:work database --sleep=3 --tries=3 --timeout=120
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ─── MySQL 8 ───────────────────────────────
  db:
    image: mysql:8.0
    container_name: jambu_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE: ${DB_DATABASE:-db_jambu_monitoring}
      MYSQL_USER: ${DB_USERNAME:-jambu_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-jambupass123}
    volumes:
      - db-data:/var/lib/mysql
    command: --innodb-buffer-pool-size=256M --max-connections=100
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Flask ML / ARIMA ──────────────────────
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: jambu_ml
    env_file:
      - ./ml/.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ─── MQTT Broker (Mosquitto) ───────────────
  mqtt:
    image: eclipse-mosquitto:2
    container_name: jambu_mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped

volumes:
  db-data:
  mosquitto-data:
  mosquitto-log:
